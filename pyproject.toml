[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limina-postprocessor"
version = "0.1.0"
description = "Post-processing for DEID synthetic output with entity replacement"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Private AI", email = "info@private-ai.com"}
]
keywords = ["nlp", "deid", "synthetic-data", "entity-replacement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pyarrow>=10.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
]

[project.scripts]
limina-postprocessor = "limina_postprocessor.processor:main"

[tool.setuptools]
packages = ["limina_postprocessor", "limina_postprocessor.handlers"]

[tool.setuptools.package-data]
limina_postprocessor = [
    "data/census_data/*.json",
    "data/*.parquet",
]
